<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Starfish Tarot</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a1128">
    <link rel="icon" type="image/png" href="/icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo" style="text-decoration: none;">Starfish Tarot</a>
        <div class="auth-links">
            <a href="library.html" class="nav-link">Library</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-box">
            <h2 id="authTitle" class="glow-text text-center" style="font-size: 2rem;">Login</h2>
            <p id="authSubtitle" class="text-center subtitle">Starfish Tarot မှ ကြိုဆိုပါသည်</p>

            <form id="authForm">
                <div class="input-group" id="nameGroup" style="display: none;">
                    <label for="userName">အမည်</label>
                    <input type="text" id="userName" placeholder="Mg Kyal Ngar">
                </div>
                <div class="input-group">
                    <label for="email">အီးမေးလ်</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="input-group">
                    <label for="password">စကားဝှက် (Password)</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="action-btn" style="width: 100%; margin-top: 1rem;" id="authSubmitBtn">အကောင့်ဝင်မည်</button>
            </form>

            <div class="text-center" style="margin: 1.5rem 0 1rem; color: var(--text-muted);">— သို့မဟုတ် —</div>
            <button type="button" id="googleLoginBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #ffffff; color: #1f1f1f; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer;">
                <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303C33.654,32.657,29.223,36,24,36c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.002,0.003-0.003l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                Google ဖြင့် Login ဝင်မည်
            </button>

            <button type="button" id="guestModeBtn" style="width: 100%; margin-top: 12px; background: transparent; color: var(--accent-cyan); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer;">Guest Mode နဲ့ သုံးကြည့်ရန်</button>

            <div class="auth-switch text-center" style="margin-top: 1.5rem;">
                <span id="authSwitchText" style="color: var(--text-muted);">အကောင့်မရှိသေးဘူးလား?</span>
                <a href="#" id="authSwitchLink" style="color: var(--accent-cyan); text-decoration: none; margin-left: 5px;">အသစ်ဖွင့်မည်</a>
            </div>
        </div>
    </main>

    <footer>
        © 2026 Starfish Tarot. Created by Mg Kyal Ngar.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('ServiceWorker registration successful');
            })
            .catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>

</body>
</html>
